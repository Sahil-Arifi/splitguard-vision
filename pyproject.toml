[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "splitguard-vision"
version = "0.1.0"
description = "Local-first computer vision dataset leakage detection, repair, and evaluation-integrity measurement."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Sahil Arifi" }]
keywords = ["computer-vision", "data-quality", "dataset-leakage", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "faiss-cpu>=1.15.0,<1.16",
    "jinja2>=3.1.6,<4",
    "matplotlib>=3.11.1,<3.12",
    "numpy>=2.4.3,<2.5",
    "pandas>=3.0.5,<3.1",
    "pillow>=12.1.1,<13",
    "psutil>=7.2.2,<8",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.13.1,<3",
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "scikit-learn>=1.9.0,<1.10",
    "scipy>=1.17.1,<1.18",
    "torch>=2.13.0,<2.14",
    "torchvision>=0.28.0,<0.29",
    "transformers>=5.15.0,<6",
    "typer>=0.27.1,<0.28",
]

[project.scripts]
splitguard = "splitguard.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1,<2",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-xdist>=3.8.0,<4",
    "ruff>=0.16.4,<0.17",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.uv]
required-version = "==0.12.5"
prerelease = "disallow"
fork-strategy = "fewest"
environments = [
    "implementation_name == 'cpython' and sys_platform == 'linux' and python_version < '3.14'",
    "implementation_name == 'cpython' and sys_platform == 'win32' and python_version < '3.14'",
]
required-environments = [
    "implementation_name == 'cpython' and sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
    "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.11'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/splitguard"]

[tool.pytest.ini_options]
addopts = "--cov=splitguard --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["splitguard"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["faiss", "matplotlib.*", "scipy.*", "sklearn.*", "torchvision.*"]
ignore_missing_imports = true
